name: Posts erzeugen

on:
  schedule:
    - cron: "0 6 * * 1,2,4,5"   # Mo, Di, Do, Fr um 6:00 UTC = 7:00 Uhr Winterzeit / 8:00 Uhr Sommerzeit
  workflow_dispatch:
    inputs:
      channel:
        description: "Kanal: heizkosten, stehtdirzu oder all"
        default: "all"
        required: true

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN_HEIZKOSTEN: ${{ secrets.IG_TOKEN_HEIZKOSTEN }}
      IG_TOKEN_STEHTDIRZU: ${{ secrets.IG_TOKEN_STEHTDIRZU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Posts erzeugen
        run: python run_create.py --channel "${{ github.event.inputs.channel || 'all' }}"
      - name: Slides hochladen
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "autopilot: neue Posts"
          git pull --rebase
          git push
      - name: Auf Freigabe warten (max. 5 Stunden)
        if: always()
        run: python run_poll.py --loop 300
