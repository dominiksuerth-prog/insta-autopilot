name: Website und Cockpit veröffentlichen

# Läuft nur, wenn sich Website oder Cockpit ändern – nicht bei neuen Slides.
on:
  push:
    branches: [main]
    paths: ["docs/*.html", "docs/cockpit/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur Website und Cockpit (ohne Slides)
        run: mkdir _site && cp docs/*.html _site/ && cp -r docs/cockpit _site/cockpit
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
