name: Einmalig aufraeumen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p autopilot templates channels/stehtdirzu docs data
          git mv core.py __init__.py autopilot/
          git mv slide.html templates/
          git mv facts.md style.md theme.css topics.txt channels/stehtdirzu/
          git mv index.html impressum.html docs/
          git mv insta docs/insta
          git mv .keep data/.keep
          touch docs/.nojekyll && git add docs/.nojekyll
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Dateien in Ordner verschieben"
          git push
