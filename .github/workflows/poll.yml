name: Telegram-Freigaben

on:
  schedule:
    - cron: "17 * * * *"        # stündlich als Reserve
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      IG_TOKEN_HEIZKOSTEN: ${{ secrets.IG_TOKEN_HEIZKOSTEN }}
      IG_TOKEN_STEHTDIRZU: ${{ secrets.IG_TOKEN_STEHTDIRZU }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Freigaben verarbeiten
        run: python run_poll.py --loop 50
      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          git diff --cached --quiet || git commit -m "autopilot: Freigaben"
          git pull --rebase
          git push
